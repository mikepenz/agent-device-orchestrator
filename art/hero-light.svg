<title id="t">devq</title>
<desc id="d">System map: agents (Claude, Codex, Gemini, subagents) request a slot from a FIFO queue stored in one SQLite file with no daemon. The queue hands out exclusive slots to devices (an emulator, a phone, a static resource). devq live watches all of it.</desc>
