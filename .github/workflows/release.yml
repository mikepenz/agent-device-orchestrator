name: Release

# On a v* tag: verify the tag, run the full CI as a gate, build devq for every
# target, write checksums, build release notes from merged PRs (plus commits
# made outside PRs), and publish a GitHub release with the archives attached
# and a signed build-provenance attestation for every asset.
# Tags with a suffix (v1.2.0-rc.1) publish as prereleases.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never abandon a half-published release

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # A bad tag fails here in seconds, before any runner builds anything.
  verify-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CARGO=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          # v1.2.0-rc.1 releases the 1.2.0 code as a prerelease.
          if [ "${TAG%%-*}" != "$CARGO" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  ci:
    name: CI gate
    needs: [verify-version]
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: [verify-version, ci]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Signing secrets live in the `release` environment (deployable from v* tags only).
    environment: release
    env:
      # Signing is opt-in: without the certificate + notary key, macOS archives ship unsigned.
      CAN_SIGN_MACOS: ${{ startsWith(matrix.os, 'macos') && secrets.MACOS_CERTIFICATE_P12 != '' && secrets.NOTARY_KEY_P8 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Import signing certificate
        if: env.CAN_SIGN_MACOS == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode -o "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERT"

      - name: Sign and notarize
        if: env.CAN_SIGN_MACOS == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          BIN="target/$TARGET/release/devq"
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          # A bare binary cannot be stapled; Gatekeeper fetches the ticket online on first run.
          KEY="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY_P8" > "$KEY"
          ZIP="$RUNNER_TEMP/devq-notarize.zip"
          ditto -c -k --keepParent "$BIN" "$ZIP"
          OUT=$(xcrun notarytool submit "$ZIP" --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
                --wait --timeout 30m --output-format json)
          echo "$OUT"
          STATUS=$(echo "$OUT" | /usr/bin/plutil -extract status raw -o - -)
          if [ "$STATUS" != "Accepted" ]; then
            ID=$(echo "$OUT" | /usr/bin/plutil -extract id raw -o - -)
            xcrun notarytool log "$ID" --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            echo "::error::notarization status: $STATUS"
            exit 1
          fi

      - name: Remove signing material
        if: always() && env.CAN_SIGN_MACOS == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/certificate.p12"

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="devq-${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          bin=devq; [[ "$TARGET" == *windows* ]] && bin=devq.exe
          cp "target/$TARGET/release/$bin" LICENSE README.md "dist/$name/"
          cd dist
          if [[ "$TARGET" == *windows* ]]; then
            7z a -bso0 "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  changelog:
    name: Build changelog
    needs: [verify-version]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changelog
        uses: mikepenz/release-changelog-builder-action@b0db9d18b53447ef9f940a46c8f31653c4d9f621 # v6.5.0
        with:
          configuration: .github/release-changelog.json
          mode: HYBRID # PRs, plus commits that landed without one
          ignorePreReleases: ${{ !contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Publish release
    needs: [verify-version, build, changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write # sign the attestation (Sigstore OIDC)
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: release-assets
          merge-multiple: true
      - name: Checksums
        working-directory: release-assets
        run: sha256sum -- * | tee CHECKSUMS-SHA256.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Release body
        env:
          # PR titles are untrusted text: pass via env and print with %s, never interpolate.
          CHANGELOG: ${{ needs.changelog.outputs.changelog }}
          VERSION: ${{ needs.verify-version.outputs.version }}
          SIGNED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.NOTARY_KEY_P8 != '' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # backticks are markdown, not shell
          {
            printf '%s\n\n' "$CHANGELOG"
            printf '## Install\n\n'
            printf -- '- **macOS**: `devq-%s-aarch64-apple-darwin.tar.gz` (Apple silicon) or `x86_64-apple-darwin`\n' "$VERSION"
            printf -- '- **Linux**: `x86_64-unknown-linux-gnu` / `aarch64-unknown-linux-gnu`\n'
            printf -- '- **Windows**: `x86_64-pc-windows-msvc.zip` (builds, runtime untested)\n\n'
            printf 'Or from source: `cargo install --git https://github.com/mikepenz/agent-device-orchestrator --tag %s --locked`\n\n' "$GITHUB_REF_NAME"
            if [ "$SIGNED" = "true" ]; then
              printf 'The macOS binaries are signed with a Developer ID certificate and notarized by Apple.\n\n'
            else
              printf 'The binaries are unsigned. On macOS, clear the quarantine flag after extracting: `xattr -d com.apple.quarantine devq`.\n\n'
            fi
            printf '<details><summary>Verify downloads</summary>\n\n```sh\nsha256sum -c CHECKSUMS-SHA256.txt\ngh attestation verify <archive> --repo mikepenz/agent-device-orchestrator\n```\n\n</details>\n'
          } > release-body.md
          cat release-body.md
      - uses: mikepenz/action-gh-release@7a1a2d94070db8d22681770f42cdb85a9c38d6ac # v3.1.0
        with:
          body_path: release-body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
          fail_on_unmatched_files: true
