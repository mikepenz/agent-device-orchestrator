name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly full dependency-age + advisory scan
  workflow_dispatch:

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain version comes from rust-toolchain.toml (pinned).
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.0"
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked
      - name: Smoke test (no device needed)
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release
          bash scripts/smoke-linux.sh target/release/devq

  windows:
    name: Windows (build only; runtime untested)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.0"
          components: clippy
      - run: cargo clippy --locked
      - run: cargo build --locked --release

  supply-chain:
    name: Supply chain & secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # dependency-age diff + gitleaks need history
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.0"
      # Exact tool versions, checksum-verified by the SHA-pinned action's manifest.
      # fallback: none = fail instead of installing an unverified binary.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
          checksum: "true"
          fallback: none

      - name: Exact dependency pins (no ranges)
        if: ${{ !cancelled() }}
        run: bash scripts/check-exact-pins.sh

      - name: Dependency minimum age (7-day cooldown)
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            bash scripts/check-dependency-age.sh --all
          else
            BASE_REF="${BASE_REF:-HEAD~1}" bash scripts/check-dependency-age.sh
          fi

      - name: cargo-deny (sources, advisories, licenses, bans)
        if: ${{ !cancelled() }}
        run: cargo deny --locked check

      - name: cargo-audit (RustSec)
        if: ${{ !cancelled() }}
        run: cargo audit --deny warnings

      - name: Actions pinned to a commit SHA
        if: ${{ !cancelled() }}
        run: |
          if unpinned=$(grep -rnE '^\s*-?\s*uses:' .github/workflows \
                | grep -vE 'uses:\s*\./' \
                | grep -vE 'uses:\s*\S+@[0-9a-f]{40}(\s|$)'); then
            echo "Unpinned actions:"; echo "$unpinned"; exit 1
          fi
          echo "✓ every action is pinned to a SHA"

      - name: Secret scan (gitleaks)
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
