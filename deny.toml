# cargo-deny: supply-chain policy gate. Run locally with `cargo deny check`;
# CI runs it in .github/workflows/ci.yml.
#
# cargo-deny has no release-age cooldown; the 7-day minimum-age rule lives in
# scripts/check-dependency-age.sh.

# Crates may only come from crates.io: no third-party registries, no git deps.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# RustSec advisories. Every ignore needs a written rationale and a revisit date.
[advisories]
version = 2
yanked = "deny"
ignore = []

# Permissive licenses only; anything not listed (GPL/AGPL/LGPL) is denied.
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
